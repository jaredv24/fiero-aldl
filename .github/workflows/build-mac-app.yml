name: Build Mac app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (e.g. v0.1.0). Leave empty to just build."
        required: false
        default: ""

permissions:
  contents: write  # needed to create the release and its tag

jobs:
  build:
    name: Mac app (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: apple-silicon
          - runner: macos-15-intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      FIERO_ALDL_DATA: ${{ github.workspace }}/selftest-data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install -r python/requirements.txt pyinstaller

      - name: Unit tests
        working-directory: python
        run: python -m unittest test_aldl_logger test_cable test_analysis test_claude_assistant test_derived test_guided_tests test_vehicle_profile test_obd test_vacuum test_compare test_checks test_history test_report test_claude_agent -v

      - name: App self-test (from source)
        working-directory: python
        run: python fiero_app.py --self-test

      - name: Build Fiero ALDL.app
        working-directory: python
        run: >
          pyinstaller --noconfirm --windowed
          --name "Fiero ALDL"
          --osx-bundle-identifier io.github.jaredv24.fieroaldl
          --add-data "definitions:definitions"
          --add-data "profiles:profiles"
          --collect-submodules anthropic
          --collect-submodules keyring
          --copy-metadata keyring
          fiero_app.py

      - name: Sign the app consistently (ad-hoc) and verify
        run: |
          xattr -cr "python/dist/Fiero ALDL.app"
          codesign --force --deep --sign - "python/dist/Fiero ALDL.app"
          codesign --verify --deep --strict --verbose=2 "python/dist/Fiero ALDL.app"

      - name: App self-test (built app)
        run: '"python/dist/Fiero ALDL.app/Contents/MacOS/Fiero ALDL" --self-test'

      - name: Zip the app
        run: ditto -c -k --keepParent "python/dist/Fiero ALDL.app" "Fiero-ALDL-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Fiero-ALDL-${{ matrix.arch }}
          path: Fiero-ALDL-${{ matrix.arch }}.zip

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Fiero ALDL ${{ inputs.release_tag || github.ref_name }}
          files: dist/*.zip
          body: |
            Mac app for reading live data from a 1985-88 Pontiac Fiero 2.8 V6 (ECM 1227170,
            GM data stream A29) through a 160 baud USB ALDL cable or the DIY Arduino interface.

            **Download** the zip for your Mac:
            - `Fiero-ALDL-apple-silicon.zip`: M1 and newer
            - `Fiero-ALDL-intel.zip`: older Intel Macs

            Unzip and drag **Fiero ALDL** to Applications. The app isn't signed by Apple, so
            macOS blocks it at first. Open Terminal and run this once, then open the app normally:

                xattr -dr com.apple.quarantine "/Applications/Fiero ALDL.app"

            Not yet tested on a real car; readings follow GM's A29 specification. See the README.
